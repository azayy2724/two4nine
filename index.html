.bottom{

height:67px;background:#091827f7;

.bottom button{
flex:1;background:none;color:#93a9bf;font-size:12px

.bottom button b{

background:#000b;display:flex;

float:right;background:none;color:#9fb1c4;

.switch{

.switch button{

.profileBox{text-align:center}

.bigAvatar{

.empty{text-align:center;padding:28px;color:#8195aa}

.toast{
position:fixed;left:50%;bottom:80px;
transform:translateX(-50%);

padding:11px 16px;border-radius:13px;
z-index:100;font-weight:700;

}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyAYS5fr01fGoQ6RGUnojdoQKZwbmgrLVYU",

authDomain:
"two4nine-7a29d.firebaseapp.com",

projectId:
"two4nine-7a29d",

storageBucket:
"two4nine-7a29d.firebasestorage.app",

messagingSenderId:
"573418811789",

appId:
"1:573418811789:web:cad8463d4cba5e8a990dc4",

measurementId:
"G-V2X4YK8NFG"

};


firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

let currentUser=null;
let profile=null;
let authMode="login";
let posts=[];
let news=[];


/* =========================
   HELPERS
========================= */

function esc(x){

return String(x||"").replace(/[&<>"']/g,function(m){

return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m];

});

}


function initials(name){

return (name||"?")
.trim()
.split(/\s+/)
.slice(0,2)
.map(x=>x[0])
.join("")
.toUpperCase()||"?";

}


function ago(date){

let d=date?.toDate?
date.toDate():
new Date(date||Date.now());

let m=Math.floor(
(Date.now()-d.getTime())/60000
);

if(m<1)return"just now";
if(m<60)return m+"m";

let h=Math.floor(m/60);

if(h<24)return h+"h";

return Math.floor(h/24)+"d";

}


function toast(text){

let t=document.getElementById("toast");

t.textContent=text;

t.classList.remove("hidden");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(function(){

t.classList.add("hidden");

},2500);

}


function closeModal(id){

document.getElementById(id)
.classList.add("hidden");

}


/* =========================
   AUTH
========================= */

function openAuth(mode){

authMode=mode;

document.getElementById("authModal")
.classList.remove("hidden");

updateAuth();

}


function switchAuth(){

authMode=
authMode==="login"
?"signup"
:"login";

updateAuth();

}


function updateAuth(){

let signup=authMode==="signup";

document.getElementById("authTitle")
.textContent=
signup
?"Create Account"
:"Login";

document.getElementById("authButton")
.textContent=
signup
?"Create Account"
:"Login";

document.getElementById("authUsername")
.style.display=
signup
?"block"
:"none";

document.getElementById("authSwitch")
.innerHTML=
signup
?
'Already have an account? <button onclick="switchAuth()">Login</button>'
:
'New here? <button onclick="switchAuth()">Create Account</button>';

}


async function doAuth(){

let email=
document.getElementById("authEmail")
.value.trim();

let password=
document.getElementById("authPassword")
.value;

let username=
document.getElementById("authUsername")
.value.trim()
.replace(/^@/,"");


if(!email||!password){

toast("Email and password required");

return;

}


try{

if(authMode==="login"){

await auth.signInWithEmailAndPassword(
email,password
);

closeModal("authModal");

toast("Welcome back ❤️");

return;

}


if(username.length<3){

toast("Username 3+ characters");

return;

}


/* Check username */

let check=
await db
.collection("users")
.where("username","==",username)
.limit(1)
.get();


if(!check.empty){

toast("Username already taken");

return;

}


/* Create account */

let result=
await auth.createUserWithEmailAndPassword(
email,password
);


/* Save profile */

await db
.collection("users")
.doc(result.user.uid)
.set({

uid:result.user.uid,
username:username,
email:email,
createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});


closeModal("authModal");

toast("Account created 🎉");


}catch(e){

console.error(e);

showFirebaseError(e);

}

}


function showFirebaseError(e){

let c=e?.code||"";

if(c.includes("email-already"))
return toast("Email already registered");

if(c.includes("invalid-email"))
return toast("Invalid email");

if(c.includes("weak-password"))
return toast("Password too weak");

if(c.includes("wrong-password"))
return toast("Wrong password");

if(c.includes("invalid-credential"))
return toast("Wrong email or password");

if(c.includes("permission-denied"))
return toast("Firestore permission denied");

toast(e?.message||"Firebase error");

}


/* =========================
   AUTH STATE
========================= */

auth.onAuthStateChanged(async function(user){

currentUser=user;

if(user){

try{

let snap=
await db
.collection("users")
.doc(user.uid)
.get();

if(snap.exists){

profile=snap.data();

}else{

profile={
username:user.email.split("@")[0],
email:user.email
};

}

}catch(e){

profile={
username:user.email.split("@")[0],
email:user.email
};

}

}else{

profile=null;

}

renderAccount();
renderStories();
loadPosts();

});


/* =========================
   ACCOUNT UI
========================= */

function renderAccount(){

let box=
document.getElementById("accountArea");

if(!currentUser){

box.innerHTML=

'<button class="topBtn" onclick="openAuth(\'login\')">Login</button>'+
'<button class="topBtn createTop" onclick="openAuth(\'signup\')">Create Account</button>';

document.getElementById("composerName")
.textContent="Welcome to two4nine";

document.getElementById("composerAvatar")
.textContent="?";

return;

}


let name=profile?.username||"User";

box.innerHTML=

'<button class="iconBtn" onclick="openMessages()">💬</button>'+
'<button class="topBtn" onclick="openProfile()">👤 '+
esc(name)+
'</button>';

document.getElementById("composerName")
.textContent="@"+name;

document.getElementById("composerAvatar")
.textContent=initials(name);

}


function openProfile(){

if(!currentUser){

openAuth("login");

return;

}

document.getElementById("profileAvatar")
.textContent=
initials(profile?.username);

document.getElementById("profileName")
.textContent="@"+(profile?.username||"User");

document.getElementById("profileEmail")
.textContent=currentUser.email;

document.getElementById("profileModal")
.classList.remove("hidden");

}


async function logout(){

await auth.signOut();

closeModal("profileModal");

toast("Logged out");

}


/* =========================
   POSTS
========================= */

async function addPost(){

if(!currentUser){

openAuth("login");

return;

}

let text=
document.getElementById("postText")
.value.trim();

if(!text){

toast("Write something first");

return;

}


try{

await db.collection("posts").add({

uid:currentUser.uid,

username:
profile?.username||"User",

text:text,

type:"post",

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});


document.getElementById("postText")
.value="";

toast("Posted ❤️");

loadPosts();

}catch(e){

showFirebaseError(e);

}

}


/* =========================
   STORIES
========================= */

async function addStory(){

if(!currentUser){

openAuth("login");

return;

}

let text=
document.getElementById("postText")
.value.trim();

if(!text){

toast("Write your story first");

return;

}


try{

await db.collection("posts").add({

uid:currentUser.uid,

username:
profile?.username||"User",

text:text,

type:"story",

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});


document.getElementById("postText")
.value="";

toast("Story added ✨");

loadPosts();

}catch(e){

showFirebaseError(e);

}

}


function renderStories(){

let list=
posts.filter(x=>x.type==="story")
.slice(0,10);

let html=

'<div class="story your" onclick="addStory()">'+
'<div class="avatar">＋</div>'+
'<div>Your Story</div>'+
'</div>';


if(profile?.username){

html+=

'<div class="story">'+
'<div class="avatar">'+
initials(profile.username)+
'</div>'+
'<div>@'+
esc(profile.username)+
'</div>'+
'</div>';

}


let defaultUsers=
["Rahul","Priya","Aman","Neha","Simran","Rohan"];

let used=[];


list.forEach(function(s){

if(used.includes(s.username))return;

used.push(s.username);

html+=

'<div class="story" onclick="toast(\'Story by '+esc(s.username)+'\')">'+
'<div class="avatar">'+
initials(s.username)+
'</div>'+
'<div>'+
esc(s.username)+
'</div>'+
'</div>';

});


defaultUsers.forEach(function(n){

if(!used.includes(n)&&n!==profile?.username){

html+=

'<div class="story">'+
'<div class="avatar">'+
n[0]+
'</div>'+
'<div>'+n+'</div>'+
'</div>';

}

});


html+=

'<div class="story">'+
'<div class="avatar">•••</div>'+
'<div>More</div>'+
'</div>';


document.getElementById("stories")
.innerHTML=html;

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

try{

let snap=
await db
.collection("posts")
.get();

posts=
snap.docs
.map(function(d){

return {
id:d.id,
...d.data()
};

})
.sort(function(a,b){

return millis(b.createdAt)-
millis(a.createdAt);

});


renderFeed();
renderStories();

}catch(e){

console.error(e);

document.getElementById("feed")
.innerHTML=
'<div class="empty">Could not load posts.</div>';

}

}


function millis(x){

if(x?.toDate)
return x.toDate().getTime();

if(x?.seconds)
return x.seconds*1000;

return 0;

}


function renderFeed(){

let feed=
document.getElementById("feed");

let normal=
posts.filter(x=>x.type!=="story");

let html="";


if(!normal.length){

html+=
'<div class="empty">No posts yet. Be the first ❤️</div>';

}


normal.forEach(function(p){

let n=esc(p.username||"User");

html+=`

<article class="card">

<div class="head">

<div class="avatar">
${initials(n)}
</div>

<div class="meta">

<div class="name">
@${n}
</div>

<div class="time">
${ago(p.createdAt)}
</div>

</div>

</div>

<div class="body">
${esc(p.text)}
</div>

<div class="actions">

<button onclick="like('${p.id}')">
♡ <span id="likes-${p.id}">0</span>
</button>

<button onclick="comment()">
💬 Comment
</button>

<button onclick="share('${esc(p.text)}')">
↗ Share
</button>

</div>

</article>

`;

});


feed.innerHTML=html;

}


/* =========================
   LIKE COMMENT SHARE
========================= */

function like(id){

let key="two4nine_like_"+id;

let n=
Number(localStorage.getItem(key)||0)+1;

localStorage.setItem(key,n);

let x=
document.getElementById("likes-"+id);

if(x)x.textContent=n;

}


function comment(){

if(!currentUser){

openAuth("login");

return;

}

let text=prompt("Write comment:");

if(text?.trim())
toast("Comment added 💬");

}


async function share(text){

try{

await navigator.clipboard.writeText(text);

toast("Copied 📋");

}catch(e){

toast("Share: "+text.slice(0,40));

}

}


/* =========================
   NEWS
========================= */

async function loadNews(){

let queries=[

["World","world"],

["War & Conflict","war conflict"],

["Sports","sports"],

["AI & Technology","AI technology"],

["Business","business"]

];

let result=[];


try{

for(let item of queries){

let category=item[0];
let query=item[1];

let rss=
"https://news.google.com/rss/search?q="+
encodeURIComponent(query)+
"&hl=en-IN&gl=IN&ceid=IN:en";

let url=
"https://api.rss2json.com/v1/api.json?rss_url="+
encodeURIComponent(rss);

let r=await fetch(url);
let data=await r.json();

(data.items||[]).slice(0,4).forEach(function(x){

result.push({

category:category,
title:x.title,
date:new Date(x.pubDate||Date.now())

});

});

}


result.sort(function(a,b){

return b.date-a.date;

});

news=result.slice(0,10);

renderNews();

}catch(e){

news=[

{
category:"World",
title:"Latest world news and international updates."
},

{
category:"AI & Tech
