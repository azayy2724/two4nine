<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>two4nine Color Play</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#07111f;
color:#fff;
font-family:Arial,sans-serif
}
.app{
max-width:700px;
margin:auto;
padding-bottom:85px
}
header{
height:64px;
background:#0b1a2b;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
position:sticky;
top:0;
z-index:5;
border-bottom:1px solid #ffffff18
}
.logo{
font-size:24px;
font-weight:900
}
.logo i{
color:#20df91;
font-style:normal
}
.bal{
background:#172a40;
padding:9px 13px;
border-radius:18px;
color:#ffd76a;
font-weight:800
}
.hero,.card{
margin:13px;
background:#0d1d30;
border:1px solid #ffffff12;
border-radius:20px;
padding:17px
}
.hero{
background:linear-gradient(135deg,#142a47,#21163e)
}
h1{
margin:0 0 6px
}
.muted{
color:#9db1c5
}
.timer{
text-align:center;
font-size:32px;
font-weight:900;
color:#35e5a0;
margin-top:14px
}
.row{
display:flex;
justify-content:space-between;
align-items:center
}
.colors{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:15px
}
.color{
padding:18px 5px;
border-radius:15px;
color:#fff;
font-weight:900
}
.red{
background:#e94455
}
.green{
background:#18b879
}
.violet{
background:#7954e8
}
.selected{
outline:3px solid white;
outline-offset:2px
}
.color small{
display:block;
margin-top:4px;
opacity:.8
}
.amounts{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:14px
}
.amount{
background:#172a40;
color:#fff;
padding:9px 13px;
border-radius:11px
}
.amount.active{
background:#35d995;
color:#00150d;
font-weight:900
}
.play{
width:100%;
margin-top:14px;
padding:14px;
background:#35d995;
color:#00150d;
border-radius:13px;
font-weight:900;
font-size:17px
}
.history{
display:flex;
gap:8px;
overflow:auto;
margin-top:12px
}
.dot{
min-width:38px;
height:38px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:900
}
.r{
background:#e94455
}
.g{
background:#18b879
}
.v{
background:#7954e8
}
table{
width:100%;
border-collapse:collapse
}
td,th{
padding:9px 4px;
border-bottom:1px solid #ffffff10;
text-align:left;
font-size:13px
}
.win{
color:#35e5a0
}
.lose{
color:#ff6875
}
nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:68px;
background:#091827f7;
border-top:1px solid #ffffff15;
display:flex;
z-index:9
}
nav button{
flex:1;
background:none;
color:#9db1c5;
font-size:12px
}
nav b{
display:block;
font-size:21px;
margin-bottom:3px
}
nav .on{
color:#35e5a0
}
.modal{
position:fixed;
inset:0;
background:#000b;
display:none;
align-items:center;
justify-content:center;
padding:18px;
z-index:20
}
.modal.show{
display:flex
}
.box{
max-width:420px;
width:100%;
background:#0d1d30;
border-radius:20px;
padding:20px
}
.close{
float:right;
background:none;
color:#9db1c5;
font-size:26px
}
.note{
font-size:12px;
color:#91a6bb;
line-height:1.5
}
#toast{
position:fixed;
bottom:82px;
left:50%;
transform:translateX(-50%);
background:#f4fbff;
color:#07111f;
padding:11px 16px;
border-radius:12px;
font-weight:800;
display:none;
z-index:30
}
</style>
</head>

<body>

<div class="app">

<header>

<div class="logo">
two<i>4</i>nine
</div>

<div class="bal">
🪙 <span id="balance">1000</span>
</div>

</header>


<section class="hero">

<h1>🎨 Color Play</h1>

<div class="muted">
Free virtual-coin color prediction demo.
</div>

<div class="timer" id="timer">
00:30
</div>

</section>


<section class="card">

<div class="row">

<b>
Round <span id="round">1001</span>
</b>

<span class="muted">
Virtual only
</span>

</div>


<div class="history" id="history">

<div class="dot r">R</div>
<div class="dot g">G</div>
<div class="dot v">V</div>
<div class="dot g">G</div>

</div>


<div class="colors">

<button
class="color red"
onclick="pick('Red',2,this)">
RED
<small>2×</small>
</button>

<button
class="color green"
onclick="pick('Green',2,this)">
GREEN
<small>2×</small>
</button>

<button
class="color violet"
onclick="pick('Violet',5,this)">
VIOLET
<small>5×</small>
</button>

</div>


<div class="amounts">

<button
class="amount active"
onclick="setAmount(10,this)">
10
</button>

<button
class="amount"
onclick="setAmount(50,this)">
50
</button>

<button
class="amount"
onclick="setAmount(100,this)">
100
</
