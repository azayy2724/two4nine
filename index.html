<style>
*{box-sizing:border-box}
body{
 margin:0;background:#07111f;color:#fff;
 font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}

.top{

.wrap{

.search{

.card{

.head .avatar{

.news{

.actions{

.row{

.secondary{

.reel{

.bottom{

.bottom button{

.bottom button b{

.modal{

 display:flex;align-items:center;
 justify-content:center;padding:18px
}
.modalBox{

.modalBox h2{margin-top:0}

.field{

.switch{

 background:#f4fbff;color:#06111e;

 z-index:80;font-weight:700;

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

apiKey:
"AIzaSyAYS5fr01fGoQ6RGUnojdoQKZBwmgrLVYU",

authDomain:
"two4nine-7a29d.firebaseapp.com",

projectId:
"two4nine-7a29d",

storageBucket:
"two4nine-7a29d.firebasestorage.app",

messagingSenderId:
"573418811789",

appId:
"1:573418811789:web:cad8463d4cba5e8a990dc4",

measurementId:
"G-V2X4YK8NFG"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let currentProfile = null;
let authMode = "login";
let allPosts = [];
let newsItems = [];


function esc(s){

return String(s ?? "").replace(/[&<>"']/g,m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m]));

}


function initials(n){

return (n || "?")
.trim()
.split(/\s+/)
.slice(0,2)
.map(x=>x[0])
.join("")
.toUpperCase() || "?";

}


function timeAgo(ts){

const d =
ts?.toDate
? ts.toDate()
: new Date(ts || Date.now());

const m =
Math.floor((Date.now()-d)/60000);

if(m<1)return "just now";

if(m<60)return m+"m";

const h=Math.floor(m/60);

if(h<24)return h+"h";

return Math.floor(h/24)+"d";

}


function toast(t){

const x=document.getElementById("toast");

x.textContent=t;

x.classList.remove("hidden");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(()=>{

x.classList.add("hidden");

},2200);

}


function closeModal(id){

document.getElementById(id)
.classList.add("hidden");

}


function requireLogin(fn){

if(!currentUser){

openAuth("login");

toast("Login required");

return;

}

fn();

}


function openAuth(mode){

authMode=mode;

document.getElementById("authModal")
.classList.remove("hidden");

updateAuthUI();

}


function switchAuth(){

authMode =
authMode==="login"
? "signup"
: "login";

updateAuthUI();

}


function updateAuthUI(){

const signup=authMode==="signup";

document.getElementById("authTitle")
.textContent =
signup
? "Create Account"
: "Login";

document.getElementById("authButton")
.textContent =
signup
? "Create Account"
: "Login";

document.getElementById("authUsername")
.style.display =
signup
? "block"
: "none";

document.getElementById("authSwitch")
.innerHTML =
signup
?
'Already have an account? <button onclick="switchAuth()">Login</button>'
:
'New here? <button onclick="switchAuth()">Create Account</button>';

}


async function doAuth(){

const email =
document.getElementById("authEmail")
.value.trim();

const pass =
document.getElementById("authPassword")
.value;

const username =
document.getElementById("authUsername")
.value.trim()
.replace(/^@/,"");

if(!email || !pass){

toast("Email and password required");

return;

}


try{

if(authMode==="login"){

await auth.signInWithEmailAndPassword(
email,
pass
);

closeModal("authModal");

toast("Welcome back ❤️");

}

else{

if(username.length<3){

toast("Username must be 3+ characters");

return;

}


const dup =
await db
.collection("users")
.where("username","==",username)
.limit(1)
.get();


if(!dup.empty){

toast("Username already taken");

return;

}


const cred =
await auth.createUserWithEmailAndPassword(
email,
pass
);


await db
.collection("users")
.doc(cred.user.uid)
.set({

uid:cred.user.uid,
username:username,
email:email,
createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});


closeModal("authModal");

toast("Account created 🎉");

}

}catch(e){

console.error(e);

toast(firebaseError(e));

}

}


function firebaseError(e){

const c=e?.code||"";

if(c.includes("email-already"))
return "Email already registered";

if(c.includes("wrong-password") ||
c.includes("invalid-credential"))
return "Wrong email or password";

if(c.includes("weak-password"))
return "Password should be stronger";

if(c.includes("network"))
return "Network problem";

return e?.message || "Something went wrong";

}


async function loadProfile(){

if(!currentUser){

currentProfile=null;

return;

}


const d =
await db
.collection("users")
.doc(currentUser.uid)
.get();


currentProfile =
d.exists
? d.data()
: {
username:
currentUser.email.split("@")[0]
};

}


auth.onAuthStateChanged(async u=>{

currentUser=u;

await loadProfile();

renderAccount();

renderStories();

loadPosts();

});


function renderAccount(){

const a =
document.getElementById("accountArea");


if(!currentUser){

a.innerHTML =

'<button class="topBtn" onclick="openAuth(\'login\')">Login</button>' +

'<button class="topBtn createTop" onclick="openAuth(\'signup\')">Create Account</button>';

document.getElementById("composerName")
.textContent="Welcome to two4nine";

document.getElementById("composerAvatar")
.textContent="?";

}

else{

const n =
currentProfile?.username || "User";

a.innerHTML =

'<button class="iconBtn" onclick="openMessages()">💬</button>' +

'<button class="topBtn" onclick="openProfile()">👤 ' +

esc(n) +

'</button>';

document.getElementById("composerName")
.textContent="@"+n;

document.getElementById("composerAvatar")
.textContent=initials(n);

}

}


function openProfile(){

document.getElementById("profileName")
.textContent="@"+
(currentProfile?.username || "User");

document.getElementById("profileEmail")
.textContent=currentUser?.email || "";

document.getElementById("profileAvatar")
.textContent=
initials(currentProfile?.username);

document.getElementById("profileModal")
.classList.remove("hidden");

}


async function logout(){

await auth.signOut();

closeModal("profileModal");

toast("Logged out");

}


async function addPost(){

if(!currentUser){

openAuth("login");

return;

}


const text =
document.getElementById("postText")
.value.trim();


if(!text){

toast("Write something first");

return;

}


try{

await db.collection("posts").add({

uid:currentUser.uid,

username:
currentProfile?.username || "User",

text:text,

type:"post",

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});


document.getElementById("postText")
.value="";

toast("Posted ❤️");

loadPosts();

}catch(e){

toast(firebaseError(e));

}

}


async function addStory(){

if(!currentUser){

openAuth("login");

return;

}


const text =
document.getElementById("postText")
.value.trim();


if(!text){

toast("Write your story first");

return;

}


try{

await db.collection("posts").add({

uid:currentUser.uid,

username:
currentProfile?.username || "User",

text:text,

type:"story",

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});


document.getElementById("postText")
.value="";

toast("Story added ✨");

renderStories();

loadPosts();

}catch(e){

toast(firebaseError(e));

}

}


async function loadPosts(){

try{

const snap =
await db
.collection("posts")
.get();

allPosts =
snap.docs
.map(d=>({

id:d.id,
...d.data()

}))
.sort((a,b)=>
getMillis(b.createdAt) -
getMillis(a.createdAt)
);

renderFeed();

renderStories();

}catch(e){

console.error(e);

document.getElementById("feed")
.innerHTML =
'<div class="empty">Could not load posts. Check Firestore rules.</div>';

}

}


function getMillis(x){

if(x?.toDate)
return x.toDate().getTime();

if(x?.seconds)
return x.seconds*1000;

return 0;

}


function renderFeed(){

const feed =
document.getElementById("feed");

const posts =
allPosts.filter(p=>p.type!=="story");

let out="";


if(!posts.length){

out +=
'<div class="empty">No posts yet. Be the first one! ❤️</div>';

}


posts.forEach(p=>{

const n=esc(p.username||"User");

out += `

<article class="card">

<div class="head">

<div class="avatar">
${esc(initials(n))}
</div>

<div class="meta">

<div class="name">
@${n}
</div>

<div class="time">
${timeAgo(p.createdAt)}
</div>

</div>

<button
class="more"
onclick="sharePost('${esc((p.text||"").replace(/'/g,""))}')">
⋯
</button>

</div>


<div class="body">
${esc(p.text||"")}
</div>


<div class="actions">

<button onclick="likePost('${p.id}')">
♡ <span id="like-${p.id}">
${likes(p.id)}
</span>
</button>

<button onclick="commentPost('${p.id}')">
💬 Comment
</button>

<button onclick="sharePost('${esc((p.text||"").replace(/'/g,""))}')">
↗ Share
</button>

</div>

</article>

`;

});


feed.innerHTML=out;

}


function likes(id){

return Number(
localStorage.getItem("like_"+id)||0
);

}


function likePost(id){

const key="like_"+id;

const n=likes(id)+1;

localStorage.setItem(key,n);

const x =
document.getElementById("like-"+id);

if(x)x.textContent=n;

}


function commentPost(id){

const text=prompt("Comment:");

if(text?.trim())
toast("Comment added 💬");

}


async function sharePost(text){

try{

await navigator.clipboard.writeText(text);

toast("Post copied 📋");

}catch(e){

toast(text.slice(0,50));

}

}


function renderStories(){

const stories =
allPosts
.filter(p=>p.type==="story")
.slice(0,12);

let html =

'<div class="story your" onclick="requireLogin(addStory)">' +

'<div class="avatar">＋</div>' +

'<div>Your Story</div>' +

'</div>';


if(currentProfile?.username){

html += `

<div class="story">

<div class="avatar">
${initials(currentProfile.username)}
</div>

<div>
@${esc(currentProfile.username)}
</div>

</div>

`;

}


const used=new Set();


stories.forEach(s=>{

if(used.has(s.username))return;

used.add(s.username);

html += `

<div
class="story"
onclick="toast('${esc(s.text||"Story").replace(/'/g,"")}')">

<div class="avatar">
${initials(s.username)}
</div>

<div>
${esc(s.username)}
</div>

</div>

`;

});


[
"Rahul",
"Priya",
"Aman",
"Neha",
"Simran",
"Rohan"
].forEach(n=>{

if(
!used.has(n) &&
n!==currentProfile?.username
){

html += `

<div class="story">

<div class="avatar">
${n[0]}
</div>

<div>${n}</div>

</div>

`;

}

});


html += `

<div class="story">

<div class="avatar">•••</div>

<div>More</div>

</div>

`;

document.getElementById("stories")
.innerHTML=html;

}


async function loadNews(){

try{

const cats=[

["World","world"],

["War & Conflict","war conflict"],

["Sports","sports"],

["AI & Technology","AI technology"],

["Business","business"]

];


const results=[];


for(const [cat,q] of cats){

const url =

"https://api.rss2json.com/v1/api.json?rss_url=" +

encodeURIComponent(

"https://news.google.com/rss/search?q="+
q+
"&hl=en-IN&gl=IN&ceid=IN:en"

);


const r=await fetch(url);

const j=await r.json();


(j.items||[])
.slice(0,5)
.forEach(x=>{

results.push({

cat:cat,

title:x.title,

link:x.link,

date:new Date(
x.pubDate || Date.now()
)

});

});

}


results.sort(
(a,b)=>b.date-a.date
);

newsItems=results.slice(0,10);

renderNews();

}catch(e){

console.error(e);

newsItems=[

{
cat:"World",
title:"Latest world news and major international updates.",
date:new Date()
},

{
cat:"AI & Technology",
title:"AI and technology continue to change everyday life.",
date:new Date()
},

{
cat:"Sports",
title:"Latest sports stories and major sporting updates.",
date:new Date()
},

{
cat:"Business",
title:"Business and market developments from around the world.",
date:new Date()
}

];

renderNews();

}

}


function renderNews(){

const feed =
document.getElementById("feed");

let news =

'<div style="padding:10px 12px 2px;font-weight:900;font-size:18px">📰 Latest News</div>';


newsItems.forEach(n=>{

news += `

<article class="card">

<div class="news">

<span class="tag">
${esc(n.cat)}
</span>

<h3>
${esc(n.title)}
</h3>

<p>
${timeAgo(n.date)} · News
</p>

</div>

<div class="actions">

<button onclick="openNews()">
Read
</button>

<button onclick="sharePost('${esc(n.title).replace(/'/g,"")}')">
↗ Share
</button>

</div>

</article>

`;

});


feed.innerHTML =
news + feed.innerHTML;

}


function openNews(){

toast("Opening latest news");

}


function renderSearch(q){

const box =
document.getElementById("searchResults");

q=q.trim().toLowerCase();


if(!q){

box.innerHTML="";

return;

}


const p =
allPosts
.filter(x=>
(x.username+" "+x.text)
.toLowerCase()
.includes(q)
)
.slice(0,8);


box.innerHTML =

'<div style="padding:8px 14px;font-weight:800">Search results</div>' +

(

!p.length

?

'<div class="empty">No matching posts.</div>'

:

p.map(x=>`

<div class="card">

<div class="head">

<div class="avatar">
${initials(x.username)}
</div>

<div>

<b>@${esc(x.username)}</b>

<div class="time">
${esc(x.text)}
</div>

</div>

</div>

</div>

`).join("")

);

}


function focusSearch(){

document
.getElementById("searchInput")
.focus();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function scrollTopPage(){

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function openMessages(){

if(!currentUser){

openAuth("login");

return;

}

document
.getElementById("messageModal")
.classList.remove("hidden");

}


async function sendMessage(){

const to =
document.getElementById("msgTo")
.value.trim()
.replace(/^@/,"");

const text =
document.getElementById("msgText")
.value.trim();


if(!to || !text){

toast("Username and message required");

return;

}


try{

await db.collection("messages").add({

uid:currentUser.uid,

from:
currentProfile?.username || "User",

to:to,

text:text,

createdAt:
firebase.firestore.FieldValue.serverTimestamp()

});


document.getElementById("msgText")
.value="";

document.getElementById("msgStatus")
.textContent="Message sent ✓";

toast("Message sent 💬");

}catch(e){

toast(firebaseError(e));

}

}


function openNotifications(){

if(!currentUser){

openAuth("login");

return;

}


document.getElementById("noticeList")
.textContent=
"No new notifications yet.";

document.getElementById("noticeModal")
.classList.remove("hidden");

}


loadNews();

setInterval(loadNews,300000);

</script>

</body>
</html>
